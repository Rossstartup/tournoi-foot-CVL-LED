<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tournoi de Foot - 7 Mai</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="max-w-5xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-center mb-6">🏆 Tournoi de Foot - Mercredi 7 Mai</h1>

    <div id="matchs"></div>

    <button onclick="genererClassement()" class="mt-6 bg-blue-600 text-white px-4 py-2 rounded-xl hover:bg-blue-700">Afficher le Classement des Poules</button>

    <div id="classement" class="mt-10"></div>

    <div id="finales" class="mt-10"></div>

    <button onclick="genererClassementFinal()" class="mt-6 bg-green-600 text-white px-4 py-2 rounded-xl hover:bg-green-700">Voir le Gagnant et Classement Général</button>

    <div id="classementFinal" class="mt-10"></div>
  </div>

  <script>
    const equipes = [
      "Equipe 1", "Equipe 2", "Equipe 3",
      "Equipe 4", "Equipe 5", "Equipe 6",
      "Equipe 7", "Equipe 8", "Equipe 9"
    ];

    const matchs = [
      { heure: "11h00", terrain: 1, e1: "Equipe 1", e2: "Equipe 2" },
      { heure: "11h00", terrain: 2, e1: "Equipe 4", e2: "Equipe 5" },
      { heure: "11h00", terrain: 3, e1: "Equipe 7", e2: "Equipe 8" },

      { heure: "11h20", terrain: 1, e1: "Equipe 2", e2: "Equipe 3" },
      { heure: "11h20", terrain: 2, e1: "Equipe 5", e2: "Equipe 6" },
      { heure: "11h20", terrain: 3, e1: "Equipe 8", e2: "Equipe 9" },

      { heure: "11h40", terrain: 1, e1: "Equipe 3", e2: "Equipe 1" },
      { heure: "11h40", terrain: 2, e1: "Equipe 5", e2: "Equipe 6" },
      { heure: "11h40", terrain: 3, e1: "Equipe 9", e2: "Equipe 7" },
    ];

    const finales = [
      { heure: "12h00", terrain: 1, label: "1er Poule A vs 1er Poule B", e1: "", e2: "" },
      { heure: "12h00", terrain: 2, label: "2e Poule A vs 2e Poule B", e1: "", e2: "" },
      { heure: "12h00", terrain: 3, label: "3e Poule A vs 3e Poule B", e1: "", e2: "" },

      { heure: "12h20", terrain: 1, label: "1er Poule B vs 1er Poule C", e1: "", e2: "" },
      { heure: "12h20", terrain: 2, label: "2e Poule B vs 2e Poule C", e1: "", e2: "" },
      { heure: "12h20", terrain: 3, label: "3e Poule B vs 3e Poule C", e1: "", e2: "" },

      { heure: "12h40", terrain: 1, label: "1er Poule C vs 1er Poule A", e1: "", e2: "" },
      { heure: "12h40", terrain: 2, label: "2e Poule C vs 2e Poule A", e1: "", e2: "" },
      { heure: "12h40", terrain: 3, label: "3e Poule C vs 3e Poule A", e1: "", e2: "" },
    ];

    const scores = {};
    equipes.forEach(e => scores[e] = { points: 0, diff: 0 });

    function afficherMatchs() {
      const container = document.getElementById("matchs");
      container.innerHTML = "";
      matchs.forEach((m, i) => {
        container.innerHTML += `
          <div class='card'>
            <div class='font-semibold'>🕐 ${m.heure} - Terrain ${m.terrain}</div>
            <div class='flex items-center space-x-2 mt-2'>
              <span class='w-32'>${m.e1}</span>
              <input type='number' min='0' id='score-${i}-1' class='w-12 p-1 border rounded' />
              <span>-</span>
              <input type='number' min='0' id='score-${i}-2' class='w-12 p-1 border rounded' />
              <span class='w-32'>${m.e2}</span>
            </div>
          </div>
        `;
      });
    }

    function genererClassement() {
      matchs.forEach((m, i) => {
        const s1 = parseInt(document.getElementById(`score-${i}-1`).value || 0);
        const s2 = parseInt(document.getElementById(`score-${i}-2`).value || 0);

        if (s1 > s2) scores[m.e1].points += 3;
        else if (s2 > s1) scores[m.e2].points += 3;
        else {
          scores[m.e1].points += 1;
          scores[m.e2].points += 1;
        }

        scores[m.e1].diff += s1 - s2;
        scores[m.e2].diff += s2 - s1;
      });

      const classementDiv = document.getElementById("classement");
      const classement = Object.entries(scores).sort((a, b) => b[1].points - a[1].points || b[1].diff - a[1].diff);

      classementDiv.innerHTML = `
        <h2 class='text-xl font-semibold mb-4'>Classement Général des Poules</h2>
        <table class='w-full text-left border-collapse'>
          <thead>
            <tr>
              <th class='border-b p-2'>Équipe</th>
              <th class='border-b p-2'>Points</th>
              <th class='border-b p-2'>Différence</th>
            </tr>
          </thead>
          <tbody>
            ${classement.map(([equipe, data]) => `
              <tr>
                <td class='border-b p-2'>${equipe}</td>
                <td class='border-b p-2'>${data.points}</td>
                <td class='border-b p-2'>${data.diff}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      const finalesDiv = document.getElementById("finales");
      finalesDiv.innerHTML = `<h2 class='text-xl font-semibold mb-4'>Finales</h2>`;
      finales.forEach((f, i) => {
        finalesDiv.innerHTML += `
          <div class='card'>
            <div class='font-semibold'>🕐 ${f.heure} - Terrain ${f.terrain} (${f.label})</div>
            <div class='flex items-center space-x-2 mt-2'>
              <input type='text' id='finale-${i}-e1' placeholder='Équipe A' class='w-32 p-1 border rounded' />
              <input type='number' min='0' id='finale-${i}-1' class='w-12 p-1 border rounded' />
              <span>-</span>
              <input type='number' min='0' id='finale-${i}-2' class='w-12 p-1 border rounded' />
              <input type='text' id='finale-${i}-e2' placeholder='Équipe B' class='w-32 p-1 border rounded' />
            </div>
          </div>
        `;
      });
    }

    function genererClassementFinal() {
      const scoresFinal = JSON.parse(JSON.stringify(scores));
      finales.forEach((f, i) => {
        const e1 = document.getElementById(`finale-${i}-e1`).value;
        const e2 = document.getElementById(`finale-${i}-e2`).value;
        const s1 = parseInt(document.getElementById(`finale-${i}-1`).value || 0);
        const s2 = parseInt(document.getElementById(`finale-${i}-2`).value || 0);

        if (!scoresFinal[e1]) scoresFinal[e1] = { points: 0, diff: 0 };
        if (!scoresFinal[e2]) scoresFinal[e2] = { points: 0, diff: 0 };

        if (s1 > s2) scoresFinal[e1].points += 3;
        else if (s2 > s1) scoresFinal[e2].points += 3;
        else {
          scoresFinal[e1].points += 1;
          scoresFinal[e2].points += 1;
        }

        scoresFinal[e1].diff += s1 - s2;
        scoresFinal[e2].diff += s2 - s1;
      });

      const classementFinalDiv = document.getElementById("classementFinal");
      const classement = Object.entries(scoresFinal).sort((a, b) => b[1].points - a[1].points || b[1].diff - a[1].diff);

      classementFinalDiv.innerHTML = `
        <h2 class='text-xl font-semibold mb-4'>🏁 Classement Général Final</h2>
        <table class='w-full text-left border-collapse'>
          <thead>
            <tr>
              <th class='border-b p-2'>Équipe</th>
              <th class='border-b p-2'>Points</th>
              <th class='border-b p-2'>Différence</th>
            </tr>
          </thead>
          <tbody>
            ${classement.map(([equipe, data]) => `
              <tr>
                <td class='border-b p-2 font-semibold'>${equipe}</td>
                <td class='border-b p-2'>${data.points}</td>
                <td class='border-b p-2'>${data.diff}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <div class='mt-4 text-xl font-bold'>🏆 Gagnant : ${classement[0][0]}</div>
      `;
    }

    afficherMatchs();
  </script>
</body>
</html>
